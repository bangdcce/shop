[project]
name = "shop-backend"
version = "0.1.0"
description = "Shop - e-commerce API (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlmodel>=0.0.50",
    "psycopg[binary]>=3.3.9",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.3",
    "pwdlib[argon2]>=0.4.2",
    "email-validator>=2.4.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "hypothesis>=6.170.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
